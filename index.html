<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Discord Bot Client Mobile</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #313338;
            color: #dbdee1;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .container {
            background-color: #2b2d31;
            width: 100%;
            max-width: 400px;
            padding: 24px 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        h1 {
            color: #f2f3f5;
            font-size: 20px;
            text-align: center;
            margin-bottom: 6px;
        }
        p.subtitle {
            color: #949ba4;
            font-size: 13px;
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 11px;
            font-weight: bold;
            color: #b5bac1;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        input, textarea, select {
            width: 100%;
            padding: 12px 14px;
            background-color: #1e1f22;
            color: #f2f3f5;
            border: 1px solid #111214;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus, textarea:focus {
            border-color: #5865f2;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #5865f2;
            color: white;
            font-weight: bold;
            font-size: 15px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            margin-top: 4px;
            transition: background-color 0.2s;
        }
        button:active {
            background-color: #4752c4;
        }
        #output-box {
            margin-top: 16px;
            background-color: #1e1f22;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            word-break: break-all;
            min-height: 40px;
            color: #949ba4;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Discord Bot Client</h1>
        <p class="subtitle">ระบบจัดการบอทรองรับจอมือถือ</p>

        <div class="form-group">
            <label for="token">Bot Token</label>
            <input type="password" id="token" placeholder="วาง Token ที่นี่..." autocomplete="off">
        </div>

        <div class="form-group">
            <label for="command">Command / Message</label>
            <input type="text" id="command" placeholder="พิมพ์ข้อความหรือคำสั่ง...">
        </div>

        <button onclick="executeAction()">ดำเนินการ</button>
        
        <div id="output-box">สถานะการทำงานจะแสดงที่นี่...</div>
    </div>

    <script>
        function executeAction() {
            const token = document.getElementById('token').value.trim();
            const command = document.getElementById('command').value.trim();
            const output = document.getElementById('output-box');

            if (!token) {
                output.style.color = '#f23f43';
                output.innerText = 'กรุณากรอก Token ก่อนใช้งาน';
                return;
            }

            output.style.color = '#dbdee1';
            output.innerText = 'กำลังประมวลผลคำสั่งบนมือถือ...';

            // ตัวอย่างจำลองการเชื่อมต่อ API ตามโครงสร้างโปรเจกต์เดิม
            setTimeout(() => {
                output.style.color = '#23a55a';
                output.innerText = 'สำเร็จ: ส่งคำสั่งเรียบร้อยแล้ว!';
            }, 1000);
        }
    </script>
</body>
</html>
