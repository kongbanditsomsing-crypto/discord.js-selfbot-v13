<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Discord Mobile Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #313338;
            color: #dbdee1;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .login-box {
            background: #2b2d31;
            padding: 24px 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }
        h2 {
            color: #f2f3f5;
            font-size: 22px;
            margin-bottom: 8px;
            text-align: center;
        }
        p.subtitle {
            color: #949ba4;
            font-size: 14px;
            margin-bottom: 20px;
            text-align: center;
        }
        label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            color: #b5bac1;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        input {
            width: 100%;
            padding: 14px;
            background: #1e1f22;
            color: #f2f3f5;
            border: 1px solid #111214;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
            margin-bottom: 16px;
        }
        input:focus {
            border-color: #5865f2;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #5865f2;
            color: white;
            font-weight: bold;
            font-size: 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:active {
            background: #4752c4;
        }
        #status {
            margin-top: 16px;
            font-size: 14px;
            text-align: center;
            word-break: break-all;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Discord Login</h2>
        <p class="subtitle">ระบบจัดการ Selfbot บนมือถือ</p>
        
        <label for="tokenInput">Account Token</label>
        <input type="password" id="tokenInput" placeholder="วาง Token ของคุณที่นี่..." autocomplete="off">
        
        <button onclick="loginBot()">เข้าสู่ระบบ</button>
        <p id="status"></p>
    </div>

    <script>
        async function loginBot() {
            const token = document.getElementById('tokenInput').value.trim();
            const status = document.getElementById('status');
            
            if (!token) {
                status.style.color = '#f23f43';
                status.innerText = 'กรุณากรอก Token ก่อนใช้งาน';
                return;
            }

            status.style.color = '#dbdee1';
            status.innerText = 'กำลังตรวจสอบการเชื่อมต่อ...';
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token })
                });
                
                const data = await response.json();
                if(data.success) {
                    status.style.color = '#23a55a';
                    status.innerText = 'สำเร็จ! เข้าสู่ระบบในชื่อ: ' + data.username;
                } else {
                    status.style.color = '#f23f43';
                    status.innerText = 'Error: ' + data.error;
                }
            } catch (err) {
                status.style.color = '#f23f43';
                status.innerText = 'เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์';
            }
        }
    </script>
</body>
</html>
